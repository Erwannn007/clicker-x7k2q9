<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Abysses">
<meta name="theme-color" content="#0e2a33">
<title>Abysses</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<style>
:root{
  --deep:#0b222a; --petrol:#0e2a33; --panel:#163a44; --panel2:#1d4652; --rim:#24525f;
  --ink:#06161c; --text:#eaf3ef; --muted:#93b1b0; --brass:#e3b04b; --brass-d:#b08328;
  --glass:#8fd3c1; --glass-d:#5aa794; --coral:#f07a62; --coral-d:#c2533d;
  --r0:#aab6b4; --r1:#6cc08a; --r2:#4a9fe0; --r3:#a57ae6; --r4:#f0b23e; --r5:#f0627e;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --font: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:var(--deep);color:var(--text);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--glass);outline-offset:2px}
#app{position:absolute;inset:0;display:flex;flex-direction:column}

/* HUD */
#hud{flex:none;padding:calc(var(--sat) + 8px) 16px 10px;display:flex;align-items:center;gap:12px;background:var(--petrol);
  border-bottom:1px solid #ffffff10;z-index:5}
.purse{display:flex;align-items:center;gap:9px;min-width:0}
.coin{width:26px;height:26px;flex:none}
.purse b{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.rate{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:1px}
.rate.boost{color:var(--brass)}
.hud-right{margin-left:auto;text-align:right}
.hud-right .lbl{font-size:12px;color:var(--muted)}
.hud-right .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}

main{flex:1;position:relative;min-height:0}
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pad{padding:16px 16px 28px}

/* Tabs */
#tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--petrol);border-top:1px solid #ffffff10;
  padding:6px 4px calc(var(--sab) + 6px);z-index:5}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--muted);font-size:11px;font-weight:600;border-radius:12px;min-height:52px}
#tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tabs button.on{color:var(--text)}
#tabs button.on svg{stroke:var(--glass)}

/* Aquarium */
.tankwrap{position:relative;flex:1;min-height:0}
canvas.full{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tank-bar{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:10px;pointer-events:none}
.tank-bar > *{pointer-events:auto}

/* Boutons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:14px;
  font-weight:700;font-size:16px;background:var(--panel2);box-shadow:inset 0 -3px 0 #00000040;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 #00000040}
.btn.brass{background:var(--brass);color:#2b1d02}
.btn.glass{background:var(--glass);color:#06231c}
.btn.coral{background:var(--coral);color:#2a0b04}
.btn.ghost{background:#ffffff12;box-shadow:none}
.btn.dark{background:#0a1d24dd;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.btn[disabled]{opacity:.42;pointer-events:none}
.btn.wide{width:100%}
.btn small{font-weight:600;opacity:.8;font-size:13px}
.feed{position:relative;flex:1}
.feed .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--brass);border-radius:2px;transition:width .3s linear}

h2{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:6px 0 4px}
h3{font-size:16px;font-weight:700;margin:22px 0 10px}
.note{color:var(--muted);font-size:14px;line-height:1.45}

/* Boutique */
.net{background:var(--panel);border-radius:18px;padding:14px;margin-top:12px;display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:center}
.net .t{font-weight:800;font-size:17px}
.net .d{font-size:13px;color:var(--muted);margin-top:2px}
.odds{grid-column:1/-1;display:flex;height:10px;border-radius:5px;overflow:hidden;background:#00000030}
.odds i{display:block;height:100%}
.oddsl{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.oddsl span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--c);margin-right:5px;vertical-align:0}
.upg{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ffffff0d}
.upg .ic{width:44px;height:44px;border-radius:12px;background:var(--panel2);display:grid;place-items:center;flex:none}
.upg .ic svg{width:24px;height:24px;stroke:var(--glass);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.upg .tx{flex:1;min-width:0}
.upg .tx b{display:block;font-size:15px}
.upg .tx span{font-size:13px;color:var(--muted)}
.upg .btn{min-height:44px;padding:0 12px;font-size:14px;min-width:92px}

/* Catalogue */
.cat-head{padding:14px 16px 8px;flex:none}
.prog{height:8px;background:#00000030;border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--glass)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px 10px;flex:none;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:0 14px;height:36px;border-radius:18px;background:var(--panel);font-size:14px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.chip.on{background:var(--text);color:var(--petrol)}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 12px 24px}
.card{background:var(--panel);border-radius:14px;padding:6px 6px 8px;position:relative;text-align:left;overflow:hidden}
.card canvas{width:100%;aspect-ratio:1.35;display:block;border-radius:9px;background:#0a2129}
.card .no{position:absolute;top:9px;left:10px;font-size:10px;color:#ffffff70;font-variant-numeric:tabular-nums;font-weight:700}
.card .nm{font-size:12px;font-weight:700;line-height:1.2;margin-top:6px;height:29px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.card .rb{position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--c)}
.card.unk .nm{color:#ffffff40}
.card.unk .rb{opacity:.3}

/* Sandbox */
.sand-top{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:8px;z-index:2}
.seg{display:flex;background:#0a1d24dd;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-radius:14px;padding:4px}
.seg button{height:42px;padding:0 14px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--text);color:var(--petrol)}
.sand-top .btn{min-height:50px;padding:0 14px;font-size:14px}
.palette{flex:none;background:var(--petrol);border-top:1px solid #ffffff10;padding:10px 0 10px}
.palette .row{display:flex;gap:8px;overflow-x:auto;padding:0 12px;scrollbar-width:none}
.palette .row::-webkit-scrollbar{display:none}
.pal{flex:none;width:76px;border-radius:12px;background:var(--panel);padding:4px;border:2px solid transparent}
.pal.on{border-color:var(--glass)}
.pal canvas{width:100%;height:46px;display:block}
.pal span{display:block;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px;text-align:center}
.palette .hint{font-size:13px;color:var(--muted);padding:0 16px 8px}

/* Combat */
.team{background:var(--panel);border-radius:18px;padding:14px;margin-top:12px;border-left:4px solid var(--tc)}
.team-h{display:flex;align-items:baseline;justify-content:space-between}
.team-h b{font-size:17px}
.team-h span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.slot{aspect-ratio:1;border-radius:12px;background:#0a2129;display:grid;place-items:center;position:relative;overflow:hidden;border:1.5px dashed #ffffff22}
.slot.f{border:1.5px solid var(--c)}
.slot canvas{width:100%;height:100%}
.slot .plus{font-size:26px;color:#ffffff40;font-weight:300}
.team-a{display:flex;gap:8px;margin-top:10px}
.team-a .btn{flex:1;min-height:44px;font-size:14px}
.vs{text-align:center;font-weight:800;color:var(--muted);margin-top:12px;font-size:14px}

/* Sheet */
#veil{position:fixed;inset:0;background:#02090ccc;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
#veil.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;background:var(--petrol);border-radius:22px 22px 0 0;z-index:21;
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding-bottom:var(--sab)}
#sheet.on{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#ffffff30;margin:8px auto 2px;flex:none}
#sheet .sb{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 18px;overscroll-behavior:contain}
.sh-title{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{width:44px;height:44px;border-radius:50%;background:#ffffff12;display:grid;place-items:center;font-size:20px;flex:none}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:7px;background:var(--c);color:#08161b}
.stage{width:100%;aspect-ratio:1.6;border-radius:16px;background:#0a2129;display:block;margin:12px 0}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--panel);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted)}
.trait{background:var(--panel);border-radius:12px;padding:12px;margin-top:8px;font-size:14px;line-height:1.4}
.trait b{color:var(--glass)}
.fl{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #ffffff0d}
.fl canvas{width:72px;height:50px;border-radius:10px;background:#0a2129;flex:none}
.fl .tx{flex:1;min-width:0}
.fl .tx b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl .tx span{font-size:12px;color:var(--muted)}
.fl .btn{min-height:42px;padding:0 10px;font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.empty{padding:28px 10px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}

/* Révélation */
#reveal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;background:#02090cdd}
#reveal.on{display:flex}
.rv{width:100%;max-width:380px;background:var(--petrol);border-radius:24px;overflow:hidden;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.rv-top{padding:14px 16px;background:var(--c);color:#08161b;display:flex;justify-content:space-between;align-items:center;font-weight:800}
.rv canvas{width:100%;aspect-ratio:1.3;display:block;background:#0a2129}
.rv-b{padding:14px 16px 16px}
.rv-b .nm{font-size:22px;font-weight:800;line-height:1.15}
.rv-b .sub{font-size:14px;color:var(--muted);margin-top:4px}
.rv-b .new{color:var(--brass);font-weight:800}
.rv-act{display:flex;gap:8px;margin-top:14px}
.rv-act .btn{flex:1}

/* Arène */
#arena{position:fixed;inset:0;z-index:40;display:none;background:#02090c}
#arena.on{display:block}
.ar-top{position:absolute;top:calc(var(--sat) + 8px);left:12px;right:12px;display:flex;gap:8px;align-items:center;z-index:2}
.hpbar{flex:1;height:14px;border-radius:7px;background:#ffffff18;overflow:hidden;position:relative}
.hpbar i{position:absolute;top:0;bottom:0;transition:width .2s}
.hpbar.a i{left:0;background:var(--glass)}
.hpbar.b i{right:0;background:var(--coral)}
.ar-top .btn{min-height:44px;padding:0 14px;font-size:14px}
.ar-res{position:absolute;left:16px;right:16px;bottom:calc(var(--sab) + 20px);background:var(--petrol);border-radius:22px;padding:18px;display:none;z-index:3;animation:pop .3s}
.ar-res.on{display:block}
.ar-res .w{font-size:24px;font-weight:800}

#toast{position:fixed;top:calc(var(--sat) + 70px);left:50%;transform:translate(-50%,-20px);opacity:0;background:var(--text);color:var(--petrol);
  padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;z-index:50;transition:all .25s;pointer-events:none;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.foot{margin-top:28px;padding-top:16px;border-top:1px solid #ffffff10}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="purse">
      <svg class="coin" viewBox="0 0 26 26"><circle cx="13" cy="13" r="12" fill="#b08328"/><circle cx="13" cy="12" r="10.5" fill="#e3b04b"/><path d="M8.5 12c2-3 6-3.4 9-.2-2.9 3.2-7 2.8-9 .2zm9 0 2.3-2v4z" fill="#8a6418"/><circle cx="11" cy="11.6" r=".9" fill="#e3b04b"/></svg>
      <div><b id="coins">0</b><div class="rate" id="rate">+0 /s</div></div>
    </div>
    <div class="hud-right"><div class="lbl">Bac</div><div class="val" id="cap">0/6</div></div>
  </header>

  <main>
    <section class="view on" id="v-aqua">
      <div class="tankwrap">
        <canvas class="full" id="tank"></canvas>
        <div class="tank-bar">
          <button class="btn dark feed" id="feedBtn"><span id="feedTx">Nourrir</span><i class="cd" id="feedCd"></i></button>
          <button class="btn dark" id="myFishBtn" style="flex:1">Mes poissons</button>
        </div>
      </div>
    </section>

    <section class="view scroll" id="v-shop"><div class="pad" id="shop"></div></section>

    <section class="view" id="v-cat">
      <div class="cat-head">
        <h2>Catalogue</h2>
        <div class="note" id="catCount">0 / 500 espèces</div>
        <div class="prog"><i id="catProg" style="width:0"></i></div>
      </div>
      <div class="chips" id="catChips"></div>
      <div class="scroll" id="catScroll" style="flex:1;min-height:0"><div class="grid" id="catGrid"></div></div>
    </section>

    <section class="view" id="v-sand">
      <div class="tankwrap">
        <canvas class="full" id="sandCv"></canvas>
        <div class="sand-top">
          <div class="seg" id="sandMode"><button data-m="add" class="on">Placer</button><button data-m="del">Retirer</button></div>
          <button class="btn dark" id="sandTheme">Lagon</button>
          <button class="btn dark" id="sandClear">Vider</button>
        </div>
      </div>
      <div class="palette"><div class="hint" id="palHint">Choisis un poisson, puis touche l’eau pour le placer.</div><div class="row" id="palette"></div></div>
    </section>

    <section class="view scroll" id="v-fight"><div class="pad" id="fight"></div></section>
  </main>

  <nav id="tabs">
    <button class="on" data-v="aqua"><svg viewBox="0 0 26 26"><path d="M7 4h12M8 4c-4 3-5 9-2 14 1.5 2.5 4 3.5 7 3.5s5.5-1 7-3.5c3-5 2-11-2-14"/><path d="M8.5 14c1.8-2.4 4.6-2.6 6.8-.2-2.2 2.4-5 2.2-6.8.2zm6.8 0 2-1.6v3.2"/></svg>Aquarium</button>
    <button data-v="shop"><svg viewBox="0 0 26 26"><path d="M5 10h16l-1.5 11h-13z"/><path d="M9 10V8a4 4 0 0 1 8 0v2"/></svg>Boutique</button>
    <button data-v="cat"><svg viewBox="0 0 26 26"><path d="M4 6c3-1.5 6-1.5 9 0v15c-3-1.5-6-1.5-9 0zM13 6c3-1.5 6-1.5 9 0v15c-3-1.5-6-1.5-9 0z"/></svg>Catalogue</button>
    <button data-v="sand"><svg viewBox="0 0 26 26"><path d="M3 20c3-2 5-2 7 0s5 2 7 0 4-2 6 0"/><path d="M8 15c1.8-2.4 4.6-2.6 6.8-.2-2.2 2.4-5 2.2-6.8.2zm6.8 0 2-1.6v3.2M19 5v5M16.5 7.5h5"/></svg>Bac à sable</button>
    <button data-v="fight"><svg viewBox="0 0 26 26"><path d="M4 13c2.4-3.4 6-3.6 8.6-.3C10 16 6.4 16.2 4 13zM22 13c-2.4-3.4-6-3.6-8.6-.3 2.6 3.3 6.2 3.5 8.6.3z"/><path d="M13 4v3M13 19v3M9 6l1.5 2M17 6l-1.5 2"/></svg>Combat</button>
  </nav>
</div>

<div id="veil"></div>
<div id="sheet"><div class="grab"></div><div class="sb" id="sheetBody"></div></div>
<div id="reveal"></div>
<div id="arena">
  <canvas class="full" id="arenaCv"></canvas>
  <div class="ar-top">
    <div class="hpbar a"><i id="hpA" style="width:100%"></i></div>
    <button class="btn dark" id="arSpeed">×1</button>
    <div class="hpbar b"><i id="hpB" style="width:100%"></i></div>
    <button class="btn dark" id="arQuit">Quitter</button>
  </div>
  <div class="ar-res" id="arRes"></div>
</div>
<div id="toast"></div>

<script>
'use strict';
/* ==========================================================
   ABYSSES — aquarium clicker
   ========================================================== */
const SAVE_KEY = 'abysses_aquarium_save_v1';
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp = (a,b,t) => a+(b-a)*t;
const hsl = (h,s,l,a=1) => `hsla(${((h%360)+360)%360},${s}%,${l}%,${a})`;
const TAU = Math.PI*2;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function wpick(R,list){let s=0;for(const[,w]of list)s+=w;let x=R()*s;for(const[k,w]of list){x-=w;if(x<=0)return k}return list[list.length-1][0]}

const UNITS=['','k','M','Md','T','Qa','Qi','Sx','Sp'];
function fmt(n){
  if(!isFinite(n))return '∞';
  if(n<1000){ if(n<10 && n%1) return n.toFixed(1).replace('.',','); return Math.floor(n).toString(); }
  let u=0; while(n>=1000&&u<UNITS.length-1){n/=1000;u++}
  return (n<100?n.toFixed(1):Math.floor(n).toString()).replace('.',',')+UNITS[u];
}

/* ---------- Raretés ---------- */
const RAR=[
  {name:'Commun',     c:'#aab6b4', n:200, inc:1,    size:.86},
  {name:'Peu commun', c:'#6cc08a', n:130, inc:4,    size:.94},
  {name:'Rare',       c:'#4a9fe0', n:90,  inc:16,   size:1.02},
  {name:'Épique',     c:'#a57ae6', n:50,  inc:70,   size:1.1},
  {name:'Légendaire', c:'#f0b23e', n:22,  inc:320,  size:1.22},
  {name:'Mythique',   c:'#f0627e', n:8,   inc:1600, size:1.36},
];

/* ---------- Génération des 500 espèces ---------- */
const NOUNS={
  oval:[['Tétra','m'],['Gobie','m'],['Barbeau','m'],['Danio','m'],['Rasbora','m'],['Platy','m'],['Guppy','m'],['Labre','m'],['Gardon','m'],['Sargue','m'],['Dorade','f'],['Corydoras','m'],['Molly','m'],['Killi','m'],['Chromis','m'],['Demoiselle','f'],['Perche','f'],['Vairon','m'],['Rotengle','m'],['Ablette','f']],

(function genSpecies(){
  const used=new Set(); let id=0;
  RAR.forEach((rar,ri)=>{
    for(let k=0;k<rar.n;k++,id++){
      const R=mulberry32(77113+id*104729);
      const sp=makeSpecies(id,ri,R);
      // nom unique
      let nm, tries=0;
      if(ri===5) nm=MYTHIC_NAMES[k];
      else{
        const [noun,g]=sp.nounG; const gi=g==='f'?1:0;
        const ca=colorAdj(sp.v.hue,sp.v.c1.s,sp.v.c1.l)[gi];
        const pa=PAT_ADJ[sp.v.pat.type][gi];
        do{
          const mode=tries<2?Math.floor(R()*3):3+Math.floor(R()*3);
          if(mode===0) nm=`${noun} ${ca}`;
          else if(mode===1) nm=sp.v.pat.type==='plain'?`${noun} ${ca}`:`${noun} ${pa}`;
          else if(mode===2) nm=sp.v.pat.type==='plain'?`${noun} ${ca}`:`${noun} ${pa} ${ca}`;
          else nm=`${noun} ${R()<.5?ca:pa} ${PLACES[Math.floor(R()*PLACES.length)]}`;
          if(ri>=2&&ri<=4&&!/ (du|de|des|d’)/.test(nm)){ const sf=SUFFIX[ri][Math.floor(R()*SUFFIX[ri].length)][gi]; if(tries>0||R()<.6) nm=`${noun} ${tries%2?pa:ca} ${sf}`; }
          tries++;
          if(tries>30) nm=`${noun} ${ca} ${PLACES[(id+tries)%PLACES.length]}`;
        }while(used.has(nm)&&tries<60);
        if(used.has(nm)) nm+=' '+(id%7+2);
      }
      used.add(nm); sp.name=nm;
      SPECIES.push(sp);
    }
  });
})();

const N=18;

    for(let i=this.bub.length-1;i>=0;i--){const b=this.bub[i];b.y-=b.v*dt;if(b.y<-5){this.bub.splice(i,1);continue}const x=b.x+Math.sin(t*3+b.ph)*3;c.beginPath();c.arc(x,b.y,b.r,0,TAU);c.stroke();c.fillStyle='rgba(255,255,255,.5)';c.fillRect(x-b.r*.4,b.y-b.r*.4,1.2,1.2)}
  }
}

/* ---------- Nageurs ---------- */
function fishLen(sp,W){return clamp(W*.15*sp.v.scale*RAR[sp.ri].size,40,140)}
function mkSwimmer(sp,sc,x,y){const W=sc.W,H=sc.H;return{sp,x:x??Math.random()*W,y:y??H*(.12+Math.random()*.6),tx:0,ty:0,vx:0,vy:0,face:Math.random()<.5?-1:1,
  len:fishLen(sp,W),spd:(28+Math.random()*24)*(sp.v.shape==='arrow'?1.5:sp.v.shape==='round'?.6:1),at:Math.random()*10,timer:0}}
function retarget(f,sc){const m=f.len*.7;f.tx=m+Math.random()*(sc.W-2*m);f.ty=sc.H*.1+Math.random()*(sc.floor-f.len*.45-sc.H*.1);f.timer=4+Math.random()*6}
function updSwimmer(f,sc,dt,food){
  let tx=f.tx,ty=f.ty,boost=1;
  if(food&&food.length){let best=null,bd=1e9;for(const p of food){const d=(p.x-f.x)**2+(p.y-f.y)**2;if(d<bd){bd=d;best=p}}
    if(best&&bd<260*260){tx=best.x;ty=best.y;boost=1.8;if(bd<(f.len*.35)**2){best.eaten=true}}}
  f.timer-=dt;const dx=tx-f.x,dy=ty-f.y,dist=Math.hypot(dx,dy);
  if(!food||!food.length){if(dist<20||f.timer<=0)retarget(f,sc)}
  const sp=f.spd*boost;const dvx=dist>1?dx/dist*sp:0,dvy=dist>1?dy/dist*sp*.6:0;
  const k=Math.min(1,dt*1.4);f.vx+=(dvx-f.vx)*k;f.vy+=(dvy-f.vy)*k;
  if(f.flee>0){f.flee-=dt}
  f.x+=f.vx*dt;f.y+=f.vy*dt;
  f.y=clamp(f.y,f.len*.3,sc.floor-f.len*.3);f.x=clamp(f.x,-f.len*.2,sc.W+f.len*.2);
  if(Math.abs(f.vx)>4){const s=Math.sign(f.vx);f.face+=(s-f.face)*Math.min(1,dt*4)}
  f.at+=dt*(.55+Math.hypot(f.vx,f.vy)/f.spd*.7);
}
function drawSwimmer(c,f){const b=Math.sin(f.at*1.3)*1.5;drawFish(c,f.sp,f.x,f.y+b,f.len,f.at,f.face)}

function prepCanvas(cv){const r=cv.getBoundingClientRect();const d=Math.min(2,devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d));const c=cv.getContext('2d');c.setTransform(d,0,0,d,0,0);return{c,w:r.width,h:r.height}}
function fitLen(sp,w,h){const v=sp.v;const hx=v.h*.5*1.6+(v.dorsal.type==='sail'?v.dorsal.hgt:v.dorsal.hgt*.7)+.1;return Math.min(w/(1.5+v.tl),h/(hx*1.25))}
function thumb(cv,sp,sil,t){const{c,w,h}=prepCanvas(cv);const L=fitLen(sp,w*.92,h*.9);drawFish(c,sp,w/2+L*.18,h/2+(sp.v.dorsal.hgt-sp.v.anal.hgt)*L*.3,L,t??.7,1,{sil})}
function liveStage(cv,sp){const o=prepCanvas(cv);live.push({...o,cv,sp,t:0})}
function drawLive(dt){for(const l of live){l.t+=dt;const{c,w,h,sp}=l;c.clearRect(0,0,w,h);
  const g=c.createRadialGradient(w/2,h/2,10,w/2,h/2,w*.7);g.addColorStop(0,'#16404c');g.addColorStop(1,'#0a2129');c.fillStyle=g;c.fillRect(0,0,w,h);
  const L=fitLen(sp,w*.82,h*.8);drawFish(c,sp,w/2+L*.18,h/2+Math.sin(l.t*1.4)*3,L,l.t,1)}}

const tankCv=$('#tank');const tankScene=new Scene(tankCv,'recif',3);
let swimmers=[],food=[],floats=[],ripples=[];let sparkT=2;
function syncSwimmers(){if(!tankScene.W)return;const ids=new Set(S.fish.map(f=>f.id));swimmers=swimmers.filter(s=>ids.has(s.inst));
  for(const f of S.fish)if(!swimmers.find(s=>s.inst===f.id)){const s=mkSwimmer(SPECIES[f.sp],tankScene);s.inst=f.id;retarget(s,tankScene);swimmers.push(s)}
  swimmers.sort((a,b)=>a.len-b.len)}
tankCv.addEventListener('pointerdown',e=>{e.preventDefault();const r=tankCv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  const v=tapVal();S.coins+=v;S.earned+=v;S.taps++;floats.push({x,y:y-10,t:`+${fmt(v)}`,life:1,c:'#ffe7a8'});ripples.push({x,y,r:4,life:1});
  for(const s of swimmers){const dx=s.x-x,dy=s.y-y,d=Math.hypot(dx,dy);if(d<110){s.vx+=dx/(d+1)*160;s.vy+=dy/(d+1)*100;s.timer=0}}hud(true)});
$('#feedBtn').addEventListener('click',()=>{const now=Date.now();if(now<S.feedAt){toast('Les poissons digèrent encore.');return}
  S.feedAt=now+120000;boostUntil=performance.now()+30000;const W=tankScene.W;for(let i=0;i<16;i++)food.push({x:W*.15+Math.random()*W*.7,y:-Math.random()*60,vy:18+Math.random()*14,ph:Math.random()*TAU});toast('Revenus doublés pendant 30 s');hud(true)});
function feedUI(){const now=Date.now();const left=S.feedAt-now;const tx=$('#feedTx'),cd=$('#feedCd');
  if(performance.now()<boostUntil){tx.textContent=`Repas ×2 · ${Math.ceil((boostUntil-performance.now())/1000)} s`;cd.style.width='100%'}
  else if(left>0){tx.textContent=`Nourrir · ${Math.ceil(left/1000)} s`;cd.style.width=(100-left/1200)+'%'}
  else{tx.textContent='Nourrir';cd.style.width='0'}}
function drawTank(t,dt){const sc=tankScene;if(!sc.resize())return;const c=sc.ctx;sc.drawBack(t);
  for(let i=food.length-1;i>=0;i--){const p=food[i];if(p.eaten){food.splice(i,1);continue}p.y=Math.min(p.y+p.vy*dt,sc.floor-2);p.x+=Math.sin(t*2+p.ph)*.3;if(p.y>=sc.floor-2){p.life=(p.life??6)-dt;if(p.life<0){food.splice(i,1);continue}}
    c.fillStyle='#c98a3c';c.fillRect(p.x-2,p.y-1.5,4,3)}
  for(const s of swimmers){updSwimmer(s,sc,dt,food);drawSwimmer(c,s)}
  sparkT-=dt;if(sparkT<=0&&swimmers.length){sparkT=3;const s=swimmers[Math.floor(Math.random()*swimmers.length)];const f=S.fish.find(q=>q.id===s.inst);if(f)floats.push({x:s.x,y:s.y-s.len*.4,t:`+${fmt(fishInc(f)*3*(1+.1*S.filtLvl))}`,life:1,c:'#e3b04b',small:true})}
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.life-=dt*1.8;r.r+=dt*90;if(r.life<=0){ripples.splice(i,1);continue}c.strokeStyle=`rgba(255,255,255,${r.life*.6})`;c.lineWidth=2;c.beginPath();c.arc(r.x,r.y,r.r,0,TAU);c.stroke()}
  drawFloats(c,dt);sc.drawFront(t,dt);
  if(!S.fish.length){c.fillStyle='rgba(255,255,255,.75)';c.font='600 15px '+getComputedStyle(document.body).fontFamily;c.textAlign='center';c.fillText('Ton bac est vide. Va pêcher à la boutique.',sc.W/2,sc.H*.42)}}
function drawFloats(c,dt){c.textAlign='center';for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt*(f.small?.8:1.1);f.y-=dt*(f.small?22:48);if(f.life<=0){floats.splice(i,1);continue}
  c.globalAlpha=Math.min(1,f.life*1.6);c.font=`800 ${f.small?13:20}px ui-rounded,-apple-system,system-ui,sans-serif`;c.lineWidth=4;c.strokeStyle='rgba(6,22,28,.55)';c.strokeText(f.t,f.x,f.y);c.fillStyle=f.c;c.fillText(f.t,f.x,f.y)}c.globalAlpha=1}

   <button class="btn ghost" id="resetBtn">Effacer la partie</button></div>`;

  $('#resetBtn').onclick=()=>{if(confirm('Effacer toute la progression ? C’est définitif.')){localStorage.removeItem(SAVE_KEY);location.reload()}};

function refreshShopBtns(){$('#shop').querySelectorAll('[data-cost]').forEach(b=>b.disabled=S.coins<+b.dataset.cost)}
function buyNet(i){const n=NETS[i];if(S.coins<n.cost)return;S.coins-=n.cost;
  const o=netOdds(n);let x=Math.random()*100,ri=0;for(;ri<6;ri++){x-=o[ri];if(x<=0)break}ri=Math.min(ri,5);
  const pool=SPECIES.filter(s=>s.ri===ri);const unseen=pool.filter(s=>!S.disc[s.id]);
  const sp=(unseen.length&&Math.random()<.45)?unseen[Math.floor(Math.random()*unseen.length)]:pool[Math.floor(Math.random()*pool.length)];
  const isNew=discover(sp.id);save();hud(true);reveal(sp,isNew)}

   <canvas id="rvCv"></canvas><div class="rv-b"><div class="nm">${sp.name}</div><div class="sub">${isNew?'<span class="new">Nouvelle espèce · </span>':''}${fmt(sp.inc)} pièces/s${full?' · ton bac est plein':''}</div>
   <div class="rv-act">${full?'':`<button class="btn glass" id="rvKeep">Mettre au bac</button>`}<button class="btn ghost" id="rvSell">Relâcher +${fmt(val)}</button></div></div></div>`;
  el.classList.add('on');live=[];requestAnimationFrame(()=>liveStage($('#rvCv'),sp));

  const grid=$('#catGrid');
  if(!catBuilt){catBuilt=true;
    catIO=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting&&!e.target.dataset.done){e.target.dataset.done=1;const id=+e.target.dataset.id;thumb(e.target.querySelector('canvas'),SPECIES[id],!S.disc[id])}},{root:$('#catScroll'),rootMargin:'300px'});
    grid.innerHTML=SPECIES.map(sp=>`<button class="card" data-id="${sp.id}" style="--c:${RAR[sp.ri].c}"><canvas></canvas><span class="no">${String(sp.id+1).padStart(3,'0')}</span><div class="nm"></div><i class="rb"></i></button>`).join('');
    grid.querySelectorAll('.card').forEach(el=>{catIO.observe(el);el.onclick=()=>{const id=+el.dataset.id;if(S.disc[id])speciesDetail(id);else toast(`Espèce ${RAR[SPECIES[id].ri].name.toLowerCase()} pas encore pêchée`)}});
    for(const sp of SPECIES)catDirty.add(sp.id);
  }
  grid.querySelectorAll('.card').forEach(el=>{const id=+el.dataset.id;const sp=SPECIES[id];const seen=!!S.disc[id];
    if(catDirty.has(id)){el.classList.toggle('unk',!seen);el.querySelector('.nm').textContent=seen?sp.name:'???';if(el.dataset.done){delete el.dataset.done;catIO.unobserve(el);catIO.observe(el)}}
    el.style.display=(catFilter==='all'||(catFilter==='seen'&&seen)||catFilter===String(sp.ri))?'':'none'});
  catDirty.clear();
}

/* ---------- Bac à sable ---------- */
const sandCv=$('#sandCv');let sandScene=null;let sandSw=[];let sandSel=null;let sandMode='add';
function openSand(){
  if(!sandScene){sandScene=new Scene(sandCv,S.sand.theme,11)}
  requestAnimationFrame(()=>{sandScene.resize();if(!sandSw.length&&S.sand.fish.length){sandSw=S.sand.fish.map(o=>{const s=mkSwimmer(SPECIES[o.sp],sandScene,o.x*sandScene.W,o.y*sandScene.H);retarget(s,sandScene);return s})}});
  $('#sandTheme').textContent=THEMES[S.sand.theme].name;
  const ids=Object.keys(S.disc).map(Number).sort((a,b)=>a-b);
  const pal=$('#palette');
  pal.innerHTML=ids.map(id=>`<button class="pal ${sandSel===id?'on':''}" data-id="${id}"><canvas></canvas><span>${SPECIES[id].name}</span></button>`).join('')||'';
  $('#palHint').textContent=ids.length?(sandMode==='add'?'Choisis un poisson, puis touche l’eau pour le placer.':'Touche un poisson pour le retirer.'):'Découvre des espèces à la boutique pour les placer ici.';
  requestAnimationFrame(()=>pal.querySelectorAll('.pal').forEach(b=>thumb(b.querySelector('canvas'),SPECIES[+b.dataset.id])));
  pal.querySelectorAll('.pal').forEach(b=>b.onclick=()=>{sandSel=+b.dataset.id;pal.querySelectorAll('.pal').forEach(x=>x.classList.toggle('on',x===b));setSandMode('add')});
}
function setSandMode(m){sandMode=m;document.querySelectorAll('#sandMode button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
  $('#palHint').textContent=m==='add'?'Choisis un poisson, puis touche l’eau pour le placer.':'Touche un poisson pour le retirer.'}
document.querySelectorAll('#sandMode button').forEach(b=>b.onclick=()=>setSandMode(b.dataset.m));
$('#sandTheme').onclick=()=>{const k=Object.keys(THEMES);S.sand.theme=k[(k.indexOf(S.sand.theme)+1)%k.length];sandScene.setTheme(S.sand.theme);$('#sandTheme').textContent=THEMES[S.sand.theme].name;save()};
$('#sandClear').onclick=()=>{if(!sandSw.length)return;sandSw=[];saveSand();toast('Bac vidé')};
function saveSand(){S.sand.fish=sandSw.map(s=>({sp:s.sp.id,x:+(s.x/sandScene.W).toFixed(3),y:+(s.y/sandScene.H).toFixed(3)}));save()}
sandCv.addEventListener('pointerdown',e=>{e.preventDefault();const r=sandCv.getBoundingClientRect();const x=e.clientX-r.left,y=e.clientY-r.top;
  if(sandMode==='add'){if(sandSel==null){toast('Choisis d’abord un poisson en bas');return}if(sandSw.length>=60){toast('60 poissons au maximum');return}
    const s=mkSwimmer(SPECIES[sandSel],sandScene,x,Math.min(y,sandScene.floor-20));retarget(s,sandScene);sandSw.push(s);sandSw.sort((a,b)=>a.len-b.len);saveSand()}
  else{let best=-1,bd=1e9;sandSw.forEach((s,i)=>{const d=Math.hypot(s.x-x,s.y-y);if(d<s.len*.7&&d<bd){bd=d;best=i}});if(best>=0){sandSw.splice(best,1);saveSand()}}});
function drawSand(t,dt){const sc=sandScene;if(!sc||!sc.resize())return;sc.drawBack(t);for(const s of sandSw){updSwimmer(s,sc,dt,null);drawSwimmer(sc.ctx,s)}sc.drawFront(t,dt)}

/* ---------- Combat ---------- */
let fightPick=null;let challenge=false;
const teamPow=ids=>ids.reduce((a,id)=>a+SPECIES[id].st.pow,0);
function renderFight(){
  const T=S.teams;const slot=(team,i)=>{const id=T[team][i];return id!=null?`<button class="slot f" style="--c:${RAR[SPECIES[id].ri].c}" data-t="${team}" data-i="${i}"><canvas data-sp="${id}"></canvas></button>`:`<button class="slot" data-t="${team}" data-i="${i}"><span class="plus">+</span></button>`};
  const row=t=>[0,1,2,3,4].map(i=>slot(t,i)).join('');
  const nA=T.a.filter(x=>x!=null).length,nB=T.b.filter(x=>x!=null).length;
  $('#fight').innerHTML=`<h2>Combat</h2><div class="note">Compose deux équipes de 5 avec tes espèces découvertes. Un défi aléatoire rapporte des pièces si tu gagnes.</div>
   <div class="team" style="--tc:var(--glass)"><div class="team-h"><b>Équipe A</b><span>Puissance ${teamPow(T.a.filter(x=>x!=null))}</span></div><div class="slots">${row('a')}</div>
   <div class="team-a"><button class="btn ghost" data-auto="a">Meilleure équipe</button><button class="btn ghost" data-clear="a">Vider</button></div></div>
   <div class="vs">contre</div>
   <div class="team" style="--tc:var(--coral)"><div class="team-h"><b>Équipe B${challenge?' · défi':''}</b><span>Puissance ${teamPow(T.b.filter(x=>x!=null))}</span></div><div class="slots">${row('b')}</div>
   <div class="team-a"><button class="btn ghost" data-rand="1">Défi aléatoire</button><button class="btn ghost" data-clear="b">Vider</button></div></div>
   <button class="btn coral wide" id="goFight" style="margin-top:18px" ${nA&&nB?'':'disabled'}>Lancer le combat</button>
   ${Object.keys(S.disc).length?'':'<div class="empty">Pêche d’abord quelques poissons : seules les espèces découvertes peuvent combattre.</div>'}`;
  requestAnimationFrame(()=>$('#fight').querySelectorAll('canvas[data-sp]').forEach(cv=>thumb(cv,SPECIES[+cv.dataset.sp])));
  $('#fight').querySelectorAll('.slot').forEach(b=>b.onclick=()=>pickFor(b.dataset.t,+b.dataset.i));
  $('#fight').querySelectorAll('[data-clear]').forEach(b=>b.onclick=()=>{S.teams[b.dataset.clear]=[];if(b.dataset.clear==='b')challenge=false;save();renderFight()});
  $('#fight').querySelectorAll('[data-auto]').forEach(b=>b.onclick=()=>{const ids=Object.keys(S.disc).map(Number).sort((x,y)=>SPECIES[y].st.pow-SPECIES[x].st.pow).slice(0,5);if(!ids.length){toast('Aucune espèce découverte');return}S.teams.a=ids;save();renderFight()});
  $('#fight').querySelector('[data-rand]').onclick=randomOpp;
  $('#goFight').onclick=startBattle;
}
function pickFor(team,i){
  const ids=Object.keys(S.disc).map(Number).sort((a,b)=>SPECIES[b].st.pow-SPECIES[a].st.pow);
  const cur=S.teams[team][i];
  openSheet(`<div class="sh-title"><div><h2>Équipe ${team.toUpperCase()} · place ${i+1}</h2><div class="note">Triées par puissance</div></div><button class="x" onclick="closeSheet()">✕</button></div>
   ${cur!=null?'<button class="btn ghost wide" id="pkRm" style="margin-top:10px">Retirer ce poisson</button>':''}
   <div class="pgrid">${ids.map(id=>`<button class="card" data-id="${id}" style="--c:${RAR[SPECIES[id].ri].c}"><canvas></canvas><div class="nm">${SPECIES[id].name}</div><span class="note" style="font-size:11px">PV ${SPECIES[id].st.hp} · ATQ ${SPECIES[id].st.atk}</span><i class="rb"></i></button>`).join('')||'<div class="empty" style="grid-column:1/-1">Aucune espèce découverte.</div>'}</div>`);
  requestAnimationFrame(()=>sheetBody.querySelectorAll('.card').forEach(c=>thumb(c.querySelector('canvas'),SPECIES[+c.dataset.id])));
  sheetBody.querySelectorAll('.card').forEach(c=>c.onclick=()=>{S.teams[team][i]=+c.dataset.id;if(team==='b')challenge=false;save();closeSheet();renderFight()});
  const rm=$('#pkRm');if(rm)rm.onclick=()=>{S.teams[team][i]=null;if(team==='b')challenge=false;save();closeSheet();renderFight()};
}
function randomOpp(){
  const A_=S.teams.a.filter(x=>x!=null);if(!A_.length){toast('Compose d’abord l’équipe A');return}
  const P=teamPow(A_);const avg=A_.reduce((a,id)=>a+SPECIES[id].ri,0)/A_.length;let best=null,bd=1e9;
  for(let k=0;k<80;k++){const t=[];for(let i=0;i<A_.length;i++){const ri=clamp(Math.round(avg+(Math.random()*2-1)*1.2),0,5);const pool=SPECIES.filter(s=>s.ri===ri);t.push(pool[Math.floor(Math.random()*pool.length)].id)}
    const d=Math.abs(teamPow(t)-P*1.04);if(d<bd){bd=d;best=t}}
  S.teams.b=best;challenge=true;save();renderFight();toast('Un banc sauvage approche…');
}

/* Arène */
const arena=$('#arena'),arCv=$('#arenaCv');let arScene=null,B=null,arSpeed=1;
function startBattle(){
  const ta=S.teams.a.filter(x=>x!=null),tb=S.teams.b.filter(x=>x!=null);if(!ta.length||!tb.length)return;
  arena.classList.add('on');$('#arRes').classList.remove('on');
  if(!arScene)arScene=new Scene(arCv,'abysses',21);
  requestAnimationFrame(()=>{arScene.resize();const W=arScene.W,H=arScene.H;
    const mk=(id,team,i,n)=>{const sp=SPECIES[id];const L=clamp(W*.13*sp.v.scale*RAR[sp.ri].size,36,110);
      const y=H*.2+(H*.6)*((i+.5)/n);return{sp,team,x:team==='a'?W*.14:W*.86,y,len:L,face:team==='a'?1:-1,hp:sp.st.hp,max:sp.st.hp,atk:sp.st.atk,spd:sp.st.spd,trait:sp.st.trait,cd:.6+Math.random()*.6,at:Math.random()*5,stun:0,lunge:0,hit:0,alive:true,dmg:0,vx:0,vy:0}};
    B={units:[...ta.map((id,i)=>mk(id,'a',i,ta.length)),...tb.map((id,i)=>mk(id,'b',i,tb.length))],fx:[],time:0,done:false,start:1.2,ch:challenge};
  });
}
$('#arSpeed').onclick=()=>{arSpeed=arSpeed===1?2:arSpeed===2?3:1;$('#arSpeed').textContent='×'+arSpeed};
$('#arQuit').onclick=()=>{arena.classList.remove('on');B=null};
function stepBattle(dt){
  if(!B||B.done)return;if(B.start>0){B.start-=dt;return}
  B.time+=dt;const U=B.units,W=arScene.W,H=arScene.H;
  for(const u of U){u.hit=Math.max(0,u.hit-dt*4);u.lunge=Math.max(0,u.lunge-dt*4);if(!u.alive)continue;u.at+=dt;
    if(u.trait==='oval')u.hp=Math.min(u.max,u.hp+u.max*.015*dt);
    if(u.stun>0){u.stun-=dt;continue}
    let tg=null,bd=1e9;for(const o of U)if(o.alive&&o.team!==u.team){const d=Math.hypot(o.x-u.x,o.y-u.y);if(d<bd){bd=d;tg=o}}
    if(!tg)continue;const range=(u.len+tg.len)*.5;const mv=30+u.spd*1.1;
    const dx=tg.x-u.x,dy=tg.y-u.y,d=Math.hypot(dx,dy)||1;
    if(d>range){u.vx+=(dx/d*mv-u.vx)*Math.min(1,dt*3);u.vy+=(dy/d*mv-u.vy)*Math.min(1,dt*3)}else{u.vx*=.85;u.vy*=.85}
    u.at+=dt*Math.hypot(u.vx,u.vy)/mv;
    u.face+=(Math.sign(dx)-u.face)*Math.min(1,dt*6);
    u.cd-=dt;
    if(d<=range*1.05&&u.cd<=0){u.cd=Math.max(.45,1.6-u.spd/110);u.lunge=1;
      if(Math.random()<(tg.trait==='long'?.22:.04)){B.fx.push({x:tg.x,y:tg.y-tg.len*.4,t:'esquive',life:1,c:'#cfe8e4',small:true});continue}
      let dm=u.atk*(.85+Math.random()*.3);let crit=Math.random()<(u.trait==='tall'?.22:.06);if(crit)dm*=1.8;
      if(u.trait==='arrow'&&tg.hp<tg.max*.5)dm*=1.4;dm=Math.round(dm);
      tg.hp-=dm;tg.hit=1;u.dmg+=dm;tg.vx+=dx/d*90;tg.vy+=dy/d*60;
      B.fx.push({x:tg.x,y:tg.y-tg.len*.4,t:String(dm),life:1,c:crit?'#ffd166':'#ffffff',small:!crit});
      if(tg.trait==='round'){const r=Math.round(dm*.25);u.hp-=r;u.hit=1;if(r>0)B.fx.push({x:u.x,y:u.y-u.len*.4,t:r,life:1,c:'#9fe3c9',small:true})}
      if(u.trait==='lantern'&&Math.random()<.25){tg.stun=.9;B.fx.push({x:tg.x,y:tg.y-tg.len*.6,t:'étourdi',life:1,c:'#b9a4ff',small:true})}
      for(const z of[tg,u])if(z.hp<=0&&z.alive){z.alive=false;z.hp=0;z.dieT=1}
    }}
  // séparation
  for(let i=0;i<U.length;i++)for(let j=i+1;j<U.length;j++){const a=U[i],b=U[j];if(!a.alive||!b.alive)continue;const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,m=(a.len+b.len)*.4;if(d<m){const p=(m-d)/2/d;a.x-=dx*p;a.y-=dy*p;b.x+=dx*p;b.y+=dy*p}}
  for(const u of U){if(!u.alive){u.dieT=Math.max(0,(u.dieT||0)-dt*.6);u.y-=dt*20;continue}u.x=clamp(u.x+u.vx*dt,u.len*.4,W-u.len*.4);u.y=clamp(u.y+u.vy*dt,H*.12,arScene.floor-u.len*.3)}
  const la=U.some(u=>u.team==='a'&&u.alive),lb=U.some(u=>u.team==='b'&&u.alive);
  if(!la||!lb||B.time>90)endBattle(la&&lb?(hpPct('a')>=hpPct('b')?'a':'b'):(la?'a':'b'));
}
const hpPct=t=>{const u=B.units.filter(x=>x.team===t);return u.reduce((a,x)=>a+x.hp,0)/u.reduce((a,x)=>a+x.max,0)};
function endBattle(w){B.done=true;const mvp=[...B.units].sort((a,b)=>b.dmg-a.dmg)[0];let rw=0;
  if(B.ch&&w==='a'){rw=Math.max(150,Math.round(teamPow(S.teams.b.filter(x=>x!=null))*3+baseIncome()*40));S.coins+=rw;S.earned+=rw;S.wins++;save();hud(true)}
  const r=$('#arRes');r.innerHTML=`<div class="w" style="color:${w==='a'?'var(--glass)':'var(--coral)'}">${w==='a'?'Victoire de l’équipe A':'Victoire de l’équipe B'}</div>
   <div class="note" style="margin-top:6px">Meilleur combattant : ${mvp.sp.name} (${mvp.dmg} dégâts)${rw?`<br>Récompense du défi : <b style="color:var(--brass)">+${fmt(rw)}</b>`:''}</div>
   <div class="rv-act"><button class="btn glass" id="arAgain">${B.ch?'Nouveau défi':'Rejouer'}</button><button class="btn ghost" id="arBack">Retour</button></div>`;
  setTimeout(()=>r.classList.add('on'),700);
  $('#arAgain').onclick=()=>{if(B.ch)randomOpp();startBattle()};$('#arBack').onclick=()=>{arena.classList.remove('on');B=null;renderFight()};
}
function drawArena(t,dt){if(!arScene||!arScene.resize())return;arScene.drawBack(t);const c=arScene.ctx;
  if(B){for(const u of B.units){if(!u.alive&&u.dieT<=0)continue;c.globalAlpha=u.alive?1:u.dieT;
      const lx=u.lunge*u.len*.18*Math.sign(u.face);const shake=u.hit?Math.sin(t*80)*2*u.hit:0;
      c.save();if(!u.alive){c.translate(u.x,u.y);c.rotate(Math.PI*(1-u.dieT)*.9*Math.sign(u.face));c.translate(-u.x,-u.y)}
      drawFish(c,u.sp,u.x+lx+shake,u.y,u.len,u.at+t*.2,u.face);c.restore();
      if(u.hit>0&&u.alive){c.globalAlpha=u.hit*.35;c.fillStyle='#fff';c.beginPath();c.arc(u.x,u.y,u.len*.35,0,TAU);c.fill()}
      c.globalAlpha=u.alive?1:u.dieT;
      if(u.alive){const w=u.len*.8,x=u.x-w/2,y=u.y-u.len*.5-10;c.fillStyle='rgba(0,0,0,.5)';c.fillRect(x-1,y-1,w+2,6);c.fillStyle=u.team==='a'?'#8fd3c1':'#f07a62';c.fillRect(x,y,w*u.hp/u.max,4);
        if(u.stun>0){c.fillStyle='#b9a4ff';c.font='700 12px system-ui';c.textAlign='center';c.fillText('✦',u.x,y-6)}}
      c.globalAlpha=1}
    for(const f of B.fx.splice(0))arFloats.push(f);
    for(let i=arFloats.length-1;i>=0;i--){const f=arFloats[i];f.life-=dt*1.2;f.y-=dt*30;if(f.life<=0){arFloats.splice(i,1);continue}c.globalAlpha=Math.min(1,f.life*1.6);c.font=`800 ${f.small?13:19}px ui-rounded,-apple-system,system-ui,sans-serif`;c.textAlign='center';c.lineWidth=4;c.strokeStyle='rgba(0,0,0,.6)';c.strokeText(f.t,f.x,f.y);c.fillStyle=f.c;c.fillText(f.t,f.x,f.y)}c.globalAlpha=1;
    if(B.start>0){c.fillStyle='rgba(255,255,255,.9)';c.font='800 34px ui-rounded,-apple-system,system-ui,sans-serif';c.textAlign='center';c.fillText(B.start>.6?'Prêts':'Combat !',arScene.W/2,arScene.H*.45)}
    $('#hpA').style.width=hpPct('a')*100+'%';$('#hpB').style.width=hpPct('b')*100+'%';}
  arScene.drawFront(t,dt)}
const arFloats=[];

/* ---------- Boucle ---------- */
let lastT=performance.now(),T0=0,saveT=0;
function frame(now){
  let dt=Math.min(.05,(now-lastT)/1000);lastT=now;T0+=dt;
  const inc=income();if(inc){S.coins+=inc*dt;S.earned+=inc*dt}
  hud();feedUI();
  if(arena.classList.contains('on')){for(let k=0;k<arSpeed;k++)stepBattle(dt);drawArena(T0,dt*arSpeed)}
  else if(view==='aqua')drawTank(T0,dt);
  else if(view==='sand')drawSand(T0,dt);
  if(live.length)drawLive(dt);
  saveT+=dt;if(saveT>5){saveT=0;save()}
  requestAnimationFrame(frame);
}

/* ---------- Démarrage ---------- */
const had=load();
if(!had){const starters=[0,1].map(()=>SPECIES[Math.floor(Math.random()*200)]);for(const sp of starters){discover(sp.id);S.fish.push({id:S.nextId++,sp:sp.id,lvl:1})}save()}
else{const away=Math.min(8*3600,(Date.now()-S.last)/1000);const g=baseIncome()*away*.5;if(away>60&&g>0){S.coins+=g;S.earned+=g;setTimeout(()=>toast(`Pendant ton absence : +${fmt(g)} pièces`),600)}}
S.teams.a=S.teams.a||[];S.teams.b=S.teams.b||[];
requestAnimationFrame(()=>{tankScene.resize();syncSwimmers();hud(true)});
if(!had)setTimeout(()=>toast('Touche l’eau pour gagner des pièces'),700);
addEventListener('resize',()=>{setTimeout(()=>{tankScene.resize();sandScene&&sandScene.resize();arScene&&arScene.resize();for(const s of swimmers)s.len=fishLen(s.sp,tankScene.W)},100)});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();else{lastT=performance.now()}});
addEventListener('pagehide',save);
requestAnimationFrame(frame);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
